<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="Sheetfit packs copies of your photos onto printable sheets with as little wasted paper as possible."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Sheetfit – pack photos onto sheets</title>
    <script>
      try {
        var stored = localStorage.getItem('sheetfit:theme')
        var dark =
          stored === 'dark' ||
          ((stored === null || stored === 'system') &&
            window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
      } catch (error) {
        /* storage unavailable: the stylesheet falls back to the light theme */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
